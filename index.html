<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio - Magic Cup</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="background-color: #ffffff; margin: 0; font-family: Arial, Helvetica, sans-serif;">

    <!-- BARRA DE NAVEGACIÓN -->
    <header class="navbar">
        <div class="logo">Magic Cup</div>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="nosotros.html">Sobre Nosotros</a></li>
                <li><a href="ventas.html">Ventas</a></li>
            </ul>
        </nav>
    </header>

    <!-- ÁREA PRINCIPAL CON FONDO BLANCO -->
    <main style="padding: 40px 15px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 80vh;">
        
        <!-- CUADRO NEGRO CENTRAL -->
        <div style="position: relative; width: 550px; max-width: 95vw; height: 550px; max-height: 95vw; background-color: #000000; border-radius: 4px; overflow: hidden; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(0,0,0,0.15);">
            
            <!-- IMAGEN CON OPACIDAD ATENUADA (opacity: 0.35) -->
            <img src="img/magiccup.png" alt="Magic Cup" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; opacity: 0.35; z-index: 1;">
            
            <!-- TEXTOS SUPERPUESTOS CON SOMBRA PARA MAYOR LEGIBILIDAD -->
            <div style="position: relative; z-index: 2; text-align: center; padding: 20px; width: 100%; box-sizing: border-box; text-shadow: 0 2px 5px rgba(0, 0, 0, 0.9);">
                <h1 style="color: #ff2a2a; font-size: 2.3rem; font-weight: 800; margin: 0 0 6px 0; letter-spacing: 1px;">MAGIC CUP</h1>
                
                <h2 style="color: #00e65a; font-size: 1.25rem; font-weight: 700; margin: 0 0 12px 0;">Tu cumpleaños también juega el Mundial</h2>
                
                <p style="color: #ffffff; font-size: 1.05rem; font-weight: 700; max-width: 440px; margin: 0 auto 8px auto; line-height: 1.35;">
                    Transforma la emoción del fútbol en una experiencia visual y emocional.
                </p>
                
                <p style="color: #ffffff; font-size: 1.1rem; font-weight: 700; margin: 0 auto 16px auto;">
                    Mundial 2026 Magic Cup
                </p>
                
                <h3 style="color: #2b7fff; font-size: 1.7rem; font-weight: 800; max-width: 440px; margin: 0 auto; line-height: 1.25;">
                    El regalo que nadie espera y que nadie olvida
                </h3>
            </div>
        </div>

        <!-- BOTÓN VERDE DEBAJO DEL RECUADRO -->
        <div style="margin-top: 30px; text-align: center;">
            <a href="productos.html" style="text-decoration: none;">
                <button class="btn-green" style="padding: 14px 34px; font-size: 1.15rem; border-radius: 6px; cursor: pointer; border: none; font-weight: bold; background-color: #008000; color: #ffffff;">
                    ¡Descubre la Magia!
                </button>
            </a>
        </div>

    </main>

</body>
</html>
